services:
  admin:
    image: ${CONNKIT_ADMIN_IMAGE:-ghcr.io/nathan77886/connkit-admin:${CONNKIT_IMAGE_TAG:-main}}
    restart: unless-stopped
    environment:
      CONNKIT_DB_DRIVER: ${CONNKIT_DB_DRIVER:-sqlite}
      CONNKIT_DB_DSN: ${CONNKIT_DB_DSN:-}
      CONNKIT_DB_PATH: /data/connkit.db
      CONNKIT_MASTER_KEY: ${CONNKIT_MASTER_KEY:?Set a base64-encoded 32-byte master key}
      CONNKIT_ADMIN_USERNAME: ${CONNKIT_ADMIN_USERNAME:-admin}
      CONNKIT_ADMIN_PASSWORD: ${CONNKIT_ADMIN_PASSWORD:?Set an admin password of 8-72 bytes}
    volumes:
      - connkit-data:/data
    ports:
      - '127.0.0.1:8080:80'
  mcp:
    init: true
    mem_limit: 768m
    cpus: 2
    pids_limit: 128
    image: ${CONNKIT_MCP_IMAGE:-ghcr.io/nathan77886/connkit-mcp:${CONNKIT_IMAGE_TAG:-main}}
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
    environment:
      CONNKIT_DB_DRIVER: ${CONNKIT_DB_DRIVER:-sqlite}
      CONNKIT_DB_DSN: ${CONNKIT_DB_DSN:-}
      CONNKIT_DB_PATH: /data/connkit.db
      CONNKIT_MASTER_KEY: ${CONNKIT_MASTER_KEY:?Set a base64-encoded 32-byte master key}
      CONNKIT_MCP_ADDR: ':8081'
      CONNKIT_MCP_ANONYMOUS_ADDR: ':8082'
      CONNKIT_MCP_TRUSTED_CIDRS: ${CONNKIT_MCP_TRUSTED_CIDRS:-}
      CONNKIT_MCP_ORIGINS: ${CONNKIT_MCP_ORIGINS:-}
    volumes:
      - connkit-data:/data
    ports:
      - '127.0.0.1:8081:8081'
      - '127.0.0.1:8082:8082'
volumes:
  connkit-data:
